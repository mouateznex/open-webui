services:
  ollama:
    volumes:
      - ollama:/root/.ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      ollama:
        condition: service_started
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set in environment or .env}'
      # Public URL Open WebUI is reachable at (used in OIDC discovery document)
      - 'WEBUI_URL=${WEBUI_URL-http://localhost:3000}'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Rocket.Chat is an OPTIONAL add-on and lives in its own portable package at
# deploy/rocketchat/.  The base stack above boots fine without it.
#
# To run Open WebUI WITH the Rocket.Chat integration:
#
#   docker compose \
#     -f docker-compose.yaml \
#     -f deploy/rocketchat/compose.yaml \
#     -f deploy/rocketchat/compose.open-webui.override.yaml \
#     --profile rocketchat up -d
#
# See deploy/rocketchat/README.md for full instructions.
# ---------------------------------------------------------------------------

volumes:
  ollama: {}
  open-webui: {}
